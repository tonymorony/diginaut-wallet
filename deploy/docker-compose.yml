# Diginaut wallet stack — everything EXCEPT the DigiByte node (#8).
# You run your own DigiByte Core v9.26+ (txindex=1, server=1); this compose
# stands up ElectrumX + indexer + faucet + wallet against it.
# Copy .env.example → .env, fill it in, then: docker compose up --build -d
# Full walkthrough: docs/SELF-HOSTING.md

services:
  electrumx:
    build: ../scripts/electrumx-regtest
    environment:
      DAEMON_URL: ${DAEMON_URL:?http://rpcuser:rpcpass@host:port of your DigiByte node}
      NET: ${DGB_NET:-regtest}
    volumes:
      - electrumx-data:/data
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

  indexer:
    build:
      context: ..
      dockerfile: deploy/node.Dockerfile
      args: { APP: indexer }
    environment:
      PORT: 8789
      # REQUIRED in a container: the services bind loopback by default, and the
      # wallet reaches this one across the compose network. No port is published
      # for it, so 0.0.0.0 here means "the compose network", not the internet.
      BIND_HOST: 0.0.0.0
      DGB_HRP: ${DGB_HRP:-dgbrt} # dgb | dgbt | dgbrt — must match the node's chain
      ELECTRUM_HOST: electrumx
      ELECTRUM_PORT: 50001
    depends_on: [electrumx]
    restart: unless-stopped

  faucet:
    build:
      context: ..
      dockerfile: deploy/node.Dockerfile
      args: { APP: faucet }
    environment:
      PORT: 8788
      BIND_HOST: 0.0.0.0 # reached by the wallet across the compose network; not published
      DGB_RPC_URL: ${DGB_RPC_URL:?http://host:port of your DigiByte node RPC}
      DGB_RPC_USER: ${DGB_RPC_USER:?}
      DGB_RPC_PASS: ${DGB_RPC_PASS:?}
      DGB_RPC_WALLET: ${FAUCET_WALLET:-faucet} # the HOT wallet — never a user wallet
      FAUCET_DATA_FILE: /data/faucet-claims.json
      FAUCET_TARGET_DD_CENTS: ${FAUCET_TARGET_DD_CENTS:-5000}
      FAUCET_COOLDOWN_HOURS: ${FAUCET_COOLDOWN_HOURS:-24}
    volumes:
      - faucet-data:/data
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

  wallet:
    build:
      context: ..
      dockerfile: deploy/node.Dockerfile
      args: { APP: wallet }
    environment:
      PORT: 8791
      # published below (and fronted by Caddy in the tls/dual overlays), so this
      # must bind the container's own interface, not its loopback
      BIND_HOST: 0.0.0.0
      DGB_RPC_URL: ${DGB_RPC_URL}
      DGB_RPC_USER: ${DGB_RPC_USER}
      DGB_RPC_PASS: ${DGB_RPC_PASS}
      FAUCET_URL: http://faucet:8788
      INDEXER_URL: http://indexer:8789
      # Mint/transfer/redeem ship together, always on (ADR-0002, release gate #17)
      # txid links in Activity/success views; empty = plain text (no explorer)
      EXPLORER_TX_URL: ${EXPLORER_TX_URL:-}
      # the price chart's history survives container restarts
      PRICE_HISTORY_FILE: /data/price-history.json
    volumes:
      - wallet-data:/data
    ports:
      - "${WALLET_PORT:-8791}:8791"
    depends_on: [indexer, faucet]
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

volumes:
  electrumx-data:
  faucet-data:
  wallet-data:
