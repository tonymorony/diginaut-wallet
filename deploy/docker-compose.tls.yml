# TLS overlay for public deployments: Caddy terminates HTTPS for the wallet
# and auto-provisions Let's Encrypt certificates for every name in $DOMAINS
# (comma-separated; falls back to the legacy single $DOMAIN).
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up --build -d
# Requires: an A record per domain pointing at this host, ports 80/443 open.
services:
  caddy:
    image: caddy:2-alpine
    command: caddy run --config /etc/caddy/Caddyfile
    environment:
      DOMAINS: ${DOMAINS:-${DOMAIN:?public hostname(s), e.g. dd.example.com}}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [wallet]
    restart: unless-stopped

  wallet:
    environment:
      # #H4: Caddy is the socket peer for every request, so without this the
      # per-IP limiter buckets the whole internet into one key — the first
      # ~120 RPCs/min serve everyone and every other user gets 429.
      TRUST_PROXY: "1"
      # #M3: Caddy terminates TLS here, so the browser can be told to stay on
      # https. Harmless on the container's plain-http hop (RFC 6797 §7.2).
      HSTS: "1"
    # with Caddy in front, the wallet itself stays off the public interface
    ports: !override
      - "127.0.0.1:8791:8791"

volumes:
  caddy-data:
